[project]
name = "xmens-samap-env"
version = "0.0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
  "sc-samap==3.0.1",
  "scanpy>=1.10.0",
  "anndata>=0.10.8",
  "numpy>=1.26.0,<2.0",
  "scipy>=1.11.0",
  "pandas>=2.0.0",
  "numba>=0.59.0",
  "leidenalg>=0.10.0",
  "igraph>=0.11.0",
  "hnswlib>=0.8.0",
  "h5py>=3.10.0",
  "umap-learn>=0.5.5",
  "scikit-learn>=1.4",
  "networkx>=3.0",
  "ipykernel",
  "xmens",
]

[tool.uv.sources]
xmens = { path = "../..", editable = true }

[tool.uv]
python-preference = "only-managed"
